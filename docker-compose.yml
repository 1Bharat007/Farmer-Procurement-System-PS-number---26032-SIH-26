services:
  # ---------------------------------------------------------------------------
  # Database Service (PostgreSQL 16)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sih_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kisan_procure_db}
      POSTGRES_USER: ${DB_USER:-kisan_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kisan_password_sih2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kisan_user} -d ${DB_NAME:-kisan_procure_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kisan_network

  # ---------------------------------------------------------------------------
  # Cache, Message Broker & Channel Layer (Redis 7)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sih_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kisan_network

  # ---------------------------------------------------------------------------
  # Backend API & WebSocket Server (Django 5.x + Daphne ASGI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-sih2026-farmer-procurement-system-secret-key}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,0.0.0.0
      - DB_NAME=${DB_NAME:-kisan_procure_db}
      - DB_USER=${DB_USER:-kisan_user}
      - DB_PASSWORD=${DB_PASSWORD:-kisan_password_sih2026}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kisan_network

  # ---------------------------------------------------------------------------
  # Celery Asynchronous Worker
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_celery_worker
    restart: unless-stopped
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-sih2026-farmer-procurement-system-secret-key}
      - DB_NAME=${DB_NAME:-kisan_procure_db}
      - DB_USER=${DB_USER:-kisan_user}
      - DB_PASSWORD=${DB_PASSWORD:-kisan_password_sih2026}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kisan_network

  # ---------------------------------------------------------------------------
  # Celery Beat Periodic Scheduler
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-sih2026-farmer-procurement-system-secret-key}
      - DB_NAME=${DB_NAME:-kisan_procure_db}
      - DB_USER=${DB_USER:-kisan_user}
      - DB_PASSWORD=${DB_PASSWORD:-kisan_password_sih2026}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kisan_network

  # ---------------------------------------------------------------------------
  # Frontend Application (Next.js 15 App Router + Tailwind + shadcn/ui)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - PORT=3000
    depends_on:
      - backend
    networks:
      - kisan_network

# ---------------------------------------------------------------------------
# Volumes & Networks
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kisan_network:
    driver: bridge
